name: Browser project files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/pages/BrowserWorkspace*'
      - 'apps/web/src/components/BrowserFileTree.tsx'
      - 'apps/web/src/util/latex-project-files.ts'
      - 'apps/web/src/util/latex-preflight.ts'
      - 'apps/web/src/components/BrowserProjects.tsx'
      - 'apps/web/src/util/browser-projects.ts'
      - 'apps/web/src/main.tsx'
      - 'apps/web/src/ServerApp.tsx'
      - 'e2e/tests/61-browser-local-files.spec.ts'
      - 'e2e/tests/62-browser-project-history.spec.ts'
      - 'e2e/playwright.browser-files.config.ts'
      - '.github/workflows/browser-files.yml'
permissions:
  contents: read
jobs:
  browser-files:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck -w apps/web
      - run: npm test -w apps/web -- latex-
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e/playwright.browser-files.config.ts
